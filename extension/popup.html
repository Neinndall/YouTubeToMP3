<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube to MP3</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="icon">🎵</span>
      <span class="title">YouTube to MP3</span>
    </div>
    <div id="statusBadge" class="status-badge offline">
      <span class="dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div class="container">
    <!-- Active YouTube Video Card -->
    <div id="videoCard" class="card hidden">
      <div class="thumb-container">
        <img id="videoThumb" src="" alt="Thumbnail">
        <div id="videoDuration" class="duration-badge">--:--</div>
      </div>
      <div class="video-info">
        <div id="videoTitle" class="video-title">Loading...</div>
      </div>
    </div>

    <!-- Manual URL Entry -->
    <div id="manualCard" class="card">
      <label for="inputUrl">YouTube URL:</label>
      <input type="text" id="inputUrl" placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <!-- Quality Selector -->
    <div class="quality-row">
      <label for="selectQuality">Quality:</label>
      <select id="selectQuality">
        <option value="320" selected>320 kbps (Maximum Quality)</option>
        <option value="256">256 kbps (High Quality)</option>
        <option value="192">192 kbps (Standard)</option>
        <option value="128">128 kbps (Lightweight)</option>
      </select>
    </div>

    <!-- Action Button -->
    <button id="btnDownload" class="btn-primary">
      <span>⬇️</span> Download as MP3
    </button>

    <!-- Progress Status -->
    <div id="progressBox" class="progress-box hidden">
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div id="lblProgress" class="progress-label">Downloading...</div>
    </div>

    <!-- Open Folder Button -->
    <button id="btnOpenFolder" class="btn-secondary">
      <span>📂</span> Open Music Folder
    </button>
  </div>

  <div id="appOfflineNotice" class="offline-notice hidden">
    💡 <b>Note:</b> Make sure the <code>YouTubeToMP3</code> app or background service is running on your PC.
  </div>

  <script src="popup.js"></script>
</body>
</html>
