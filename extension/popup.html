<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>YouTube to MP3</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="icon">🎵</span>
      <span class="title">YouTube to MP3</span>
    </div>
    <div id="statusBadge" class="status-badge offline">
      <span class="dot"></span>
      <span id="statusText">Desconectado</span>
    </div>
  </div>

  <div class="container">
    <!-- Vista cuando se está en un vídeo de YouTube -->
    <div id="videoCard" class="card hidden">
      <div class="thumb-container">
        <img id="videoThumb" src="" alt="Thumbnail">
        <div id="videoDuration" class="duration-badge">--:--</div>
      </div>
      <div class="video-info">
        <div id="videoTitle" class="video-title">Cargando...</div>
      </div>
    </div>

    <!-- Entrada manual cuando no se está en un vídeo de YouTube -->
    <div id="manualCard" class="card">
      <label for="inputUrl">Enlace de YouTube:</label>
      <input type="text" id="inputUrl" placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <!-- Opciones de Calidad -->
    <div class="quality-row">
      <label for="selectQuality">Calidad:</label>
      <select id="selectQuality">
        <option value="320" selected>320 kbps (Máxima Fidelidad)</option>
        <option value="256">256 kbps (Muy Alta)</option>
        <option value="192">192 kbps (Estándar)</option>
        <option value="128">128 kbps (Ligero)</option>
      </select>
    </div>

    <!-- Botón de Descarga -->
    <button id="btnDownload" class="btn-primary">
      <span>⬇️</span> Descargar en MP3
    </button>

    <!-- Estado y Progreso -->
    <div id="progressBox" class="progress-box hidden">
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div id="lblProgress" class="progress-label">Descargando...</div>
    </div>

    <!-- Botón Abrir Carpeta -->
    <button id="btnOpenFolder" class="btn-secondary">
      <span>📂</span> Abrir Carpeta de Música
    </button>
  </div>

  <div id="appOfflineNotice" class="offline-notice hidden">
    💡 <b>Nota:</b> Para descargar, abre la aplicación <code>YouTubeToMP3</code> en tu PC.
  </div>

  <script src="popup.js"></script>
</body>
</html>
